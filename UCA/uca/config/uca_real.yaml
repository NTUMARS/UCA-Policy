defaults:
  - task: real_pick_rebuttal

name: train_uca_real

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "debug"

# real-robot inference/execution horizon
horizon: 16
n_obs_steps: 2
n_action_steps: 15
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0

policy:
  _target_: uca.policy.ict1policy.DiTMeanpolicy
  use_point_crop: true
  crop_shape:
  - 84
  - 84
  encoder_output_dim: 64
  horizon: ${horizon}
  n_action_steps: ${n_action_steps}
  n_obs_steps: ${n_obs_steps}

  shape_meta: ${shape_meta}
  use_pc_color: false
  pointnet_type: "mlp"
  pointcloud_encoder_cfg:
    in_channels: 3
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm # layernorm, none
    normal_channel: false

  n_layer: 8
  n_head: 8
  n_emb: 384
  num_t_tokens: 1
  num_h_tokens: 1

ema:
  _target_: uca.model.mean.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-3

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  # 301 epochs => last logged epoch index is 300
  num_epochs: 301
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 200
  # every epoch so topk can track the lowest-loss checkpoint
  checkpoint_every: 1
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0
  max_grad_norm: 1.0
  ema_decay: 0.9999

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: ${exp_name}_${training.seed}
  project: uca
  resume: true
  tags:
  - uca
  - real
  - h16a15

checkpoint:
  save_ckpt: True
  topk:
    # real tasks set test_mean_score = -train_loss, so max <=> lowest loss
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.5f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False
  save_epoch_ckpts: [300]

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
